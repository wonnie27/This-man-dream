
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>03:17</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: #08090d;
  color: #f4f1ed;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}
.phone {
  width: min(100%, 390px);
  height: min(844px, 100dvh);
  min-height: 600px;
  position: relative;
  overflow: hidden;
  padding: 28px;
  border-radius: 48px;
  border: 2px solid #454650;
  box-shadow:
    0 0 0 4px #17181d,
    0 20px 60px #00000080;
  background:
    radial-gradient(ellipse at 50% 35%, #343747 0%, #171923 38%, #090a0e 78%);
  display: flex;
  flex-direction: column;
  align-items: center;
  border: 1px solid #34343b;
}
.status {
  width: 100%;
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  letter-spacing: 1px;
}
.date {
  margin-top: 105px;
  font-size: 15px;
  letter-spacing: 2px;
  color: #c8c5ce;
}
.time {
  margin-top: 8px;
  font-size: 88px;
  font-weight: 200;
  letter-spacing: -5px;
}
.message {
  margin-top: auto;
  margin-bottom: 28px;
  text-align: center;
  font-size: 13px;
  line-height: 2;
  color: #b9b7c1;
  letter-spacing: 1px;
}
.bottom {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: #aaa8b2;
}

.flash, .camera {
  appearance: none;
  -webkit-appearance: none;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: rgba(120, 120, 130, 0.20);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.flash svg, .camera svg {
  width: 23px;
  height: 23px;
  display: block;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.home {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 105px;
  height: 4px;
  border-radius: 10px;
  background: #eee;
}
</style>
</head>
<body>
<main class="phone">
  <div class="status">
    <span>03:17</span>
    <span>◔ &nbsp; Wi-Fi &nbsp; ▰</span>
  </div>

  <div class="date">MONDAY, OCTOBER 21</div>
  <div class="time">03:17</div>


  <div class="bottom">

<button class="flash" aria-label="손전등">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M8 3h8l-1 5H9L8 3Z" fill="currentColor" stroke="none"/>
    <path d="M9 8h6l1 12H8L9 8Z" fill="currentColor" stroke="none"/>
    <path d="M12 11v4" stroke="#55555c" stroke-width="1.5"/>
  </svg>
</button>
<span>밀어서 열기</span>
<button class="camera" aria-label="카메라">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 8h4l1.5-2h5L16 8h4a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/>
    <circle cx="12" cy="13" r="3.5"/>
  </svg>
</button>

  </div>
  <div class="home"></div>
</main>
</body>
</html>
