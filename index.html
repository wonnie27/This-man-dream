
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>03:17</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: #08090d;
  color: #f4f1ed;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}
.phone {
  width: min(100%, 390px);
  height: min(844px, 100dvh);
  min-height: 600px;
  position: relative;
  overflow: hidden;
  padding: 28px;
  background:
    radial-gradient(ellipse at 50% 35%, #343747 0%, #171923 38%, #090a0e 78%);
  display: flex;
  flex-direction: column;
  align-items: center;
  border: 1px solid #34343b;
}
.status {
  width: 100%;
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  letter-spacing: 1px;
}
.date {
  margin-top: 105px;
  font-size: 15px;
  letter-spacing: 2px;
  color: #c8c5ce;
}
.time {
  margin-top: 8px;
  font-size: 88px;
  font-weight: 200;
  letter-spacing: -5px;
}
.message {
  margin-top: auto;
  margin-bottom: 28px;
  text-align: center;
  font-size: 13px;
  line-height: 2;
  color: #b9b7c1;
  letter-spacing: 1px;
}
.bottom {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: #aaa8b2;
}
.flash, .camera {
  border: 1px solid #686873;
  background: #ffffff12;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  display: grid;
  place-items: center;
}
.home {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 105px;
  height: 4px;
  border-radius: 10px;
  background: #eee;
}
</style>
</head>
<body>
<main class="phone">
  <div class="status">
    <span>03:17</span>
    <span>◔ &nbsp; Wi-Fi &nbsp; ▰</span>
  </div>

  <div class="date">MONDAY, OCTOBER 21</div>
  <div class="time">03:17</div>

  <div class="message">
    아직 꿈속에 있어.<br>
    <span style="opacity:.65">누군가 너에게 신호를 보내고 있다.</span>
  </div>

  <div class="bottom">
    <div class="flash">◉</div>
    <span>밀어서 열기</span>
    <div class="camera">⌕</div>
  </div>
  <div class="home"></div>
</main>
</body>
</html>
